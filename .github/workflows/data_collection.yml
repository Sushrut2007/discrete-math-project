name: Automated Satellite Data Collection

on:
  schedule:
    # Runs every 12 hours (00:00 UTC and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: satellite-data-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-data:
    name: Fetch Latest Celestrak Orbit Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate satellite data
        run: |
          python src/data/fetch.py

      - name: Commit and push changes if updated
        run: |
          if git status --porcelain data/raw/latest_satellite_data.csv | grep -q 'data/raw/latest_satellite_data.csv'; then
            echo "New satellite orbital data detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/raw/latest_satellite_data.csv
            git commit -m "Auto: Update latest satellite data ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
            git push
          else
            echo "Satellite data is already up to date. No commit needed."
          fi
